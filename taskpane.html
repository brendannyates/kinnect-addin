<!DOCTYPE html>
<html lang="en" data-app="kinnect">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinnect Relay</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="shell.css?v=8">
<link rel="stylesheet" href="dev-updates.css?v=8">
<style>
/* every colour comes from these tokens; the toolbar's light / dark switches to dark (html[data-theme], shell.js) */
:root{color-scheme:light;--ink:#1c2a33;--mute:#5a6a75;--line:#dde3e8;--bg:#fff;--wash:#f3f6f8;--acc:#0f6e6e;--acc-h:#0b5858;--acc-ink:#fff;--acc-w:#e2f1f1;--red:#b3261e;--red-w:#fbe9e7;--amb:#8a5a00;--amb-w:#fdf1d8;--chip:#fff;--shadow:0 1px 2px rgba(16,28,34,.06),0 10px 28px -14px rgba(16,28,34,.18)}
:root[data-theme="dark"]{color-scheme:dark;--ink:#e6edf0;--mute:#9fb0ba;--line:#2e3c44;--bg:#11181c;--wash:#18232a;--acc:#5ec9c4;--acc-h:#82d9d5;--acc-ink:#062625;--acc-w:#153535;--red:#f19189;--red-w:#43211e;--amb:#e9b150;--amb-w:#3a2d13;--chip:#1d2a31;--shadow:0 0 0 1px rgba(255,255,255,.05),0 10px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{padding:6px 8px 8px 12px;border-bottom:1px solid var(--line)}
/* first line: the name and the toolbar flush right; second: who's here, and who this computer is for */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow.sub{min-height:22px}
#role{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:12px}
#role button.sm{margin:0}
h1{font-size:15px;margin:0;font-weight:650}
h2{font-size:13px;margin:0 0 6px;font-weight:650}
h2 .n{color:var(--mute);font-weight:400;margin-left:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:4px 9px;border-radius:4px}
button:hover{background:var(--wash)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.pri:hover{background:var(--acc-h)}
button.sm{padding:1px 8px;font-size:12px;margin:3px 4px 0 0}
button.big{flex:1;padding:10px;font-size:14px;font-weight:650}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:100%;background:var(--bg);color:var(--ink)}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
section{padding:12px}
.group{margin-bottom:16px}
.row{display:flex;gap:6px}
.row>*{flex:1}
.launch{display:flex;gap:8px;margin-bottom:6px}
.item{padding:6px 8px;border-left:3px solid var(--line);margin-bottom:4px;background:var(--wash);border-radius:0 4px 4px 0}
.item.new{border-left-color:var(--red);background:var(--red-w)}
.item.ack{opacity:.7}
.sub{color:var(--mute);font-size:12px}
.none{color:var(--mute);font-style:italic;font-size:12.5px}
.chip{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;background:var(--chip);border:1px solid var(--line);margin-left:4px}
.banner{margin:10px 12px 0;padding:8px 10px;border-radius:4px;background:var(--amb-w);color:var(--amb);font-size:12.5px}
.banner.red{background:var(--red-w);color:var(--red);font-weight:650}
.who{cursor:pointer;color:var(--acc);text-decoration:underline;font-size:12px}
.card{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:13px;margin-top:10px}
.chk input{width:auto}
details.group summary{cursor:pointer;margin-bottom:6px}
.app{color:var(--acc)}
.kbar{display:flex;gap:2px;padding:4px 8px;background:var(--wash);border-bottom:1px solid var(--line);overflow-x:auto}
.tool{border:0;background:none;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap;color:var(--ink)}
.tool.on{background:var(--acc);color:var(--acc-ink);font-weight:650}
.tool.unset{color:var(--mute)}
.views{display:flex;border-bottom:1px solid var(--line)}
.vw{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:7px 6px}
.vw.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:650}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;font-weight:650;text-align:left;cursor:pointer}
.linkbtn:hover{background:none;color:var(--acc-h)}
#gQ{margin-bottom:2px}
.hint{color:var(--mute);font-size:11.5px;margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;z-index:70;padding:8px 10px;border-radius:4px;background:var(--ink);color:var(--bg);display:none}
#toast.err{background:var(--red)}
/* names the shared screens (and the Dev Update bell) read */
:root{--surface:var(--bg);--surface-2:var(--line);--surface-3:var(--wash);--muted:var(--mute);--faint:#9aa6ae;--accent:var(--acc);--accent-soft:var(--acc-w);--danger:var(--red);--danger-soft:var(--red-w);--warn:var(--amb);--font:"Segoe UI",system-ui,sans-serif}
:root[data-theme="dark"]{--faint:#5d6c75}
#who{display:flex;align-items:center}
#who .tools{margin-left:2px}
.du-bell,.du-head button{border:0}
/* full screen (shell.css draws the rail): the rail has Messages, Ops Guide and Settings, so the tabs go */
#rail{display:contents}
#frame:not(.fsframe) #rail{display:none}
body.fs #views{display:none}
body.fs header{padding:0 0 14px;border-bottom:0}
body.fs .hrow.sub{min-height:0}
body.fs h1{font-size:22px;line-height:40px}
body.fs .kbar{border:0;border-radius:10px;padding:4px}
body.fs #banner .banner{margin:10px 0 0}
body.fs main section{padding:16px 0}
body.fs .fsframe>.page{background:var(--bg)}
body.fs .rescards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
body.fs .rescards .card{margin:0}
.me{font-size:12px;color:var(--mute);margin-top:1px}
.me b{color:var(--ink);font-weight:650}
.me .linkbtn{font-weight:400}
/* the loading screen on open, then "Enter your name" (both from the IVK Tracker) */
.boot{position:fixed;inset:0;z-index:50;display:flex;overflow:auto;background:var(--bg);padding:24px}
.bootin{width:min(380px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.bootin h1{margin:22px 0 0;font-size:24px}.bootin>p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:kinspin .9s linear infinite}
@keyframes kinspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.steps{list-style:none;width:100%;margin:24px 0 0;padding:0;text-align:left}
.step{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.step .k{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:11px;font-weight:650;color:var(--acc-ink)}
.step.done .k{background:var(--acc);border-color:var(--acc)}
.step.now .k{border-color:var(--ink)}
.step .t{font-size:14px}
.step .m{display:block;min-height:17px;font-size:12.5px;color:var(--mute);margin-top:1px}
.step.next .t{color:var(--faint)}
.boot.pick .bootin{width:min(420px,100%)}
.whohero{display:flex;flex-direction:column;align-items:center}
.whohero h1{margin:0;font-size:24px}
.whohero p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.wholist{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:22px}
.wholist .whob{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);color:var(--acc);font-size:16px;font-weight:650;text-align:left}
.wholist .whob:hover{background:var(--acc-w)}
.whob .chip{font-weight:400;color:var(--mute)}
.whonew{width:100%;margin-top:14px;text-align:left}
.whonew>summary{display:flex;align-items:center;min-height:44px;font-weight:650;color:var(--acc);cursor:pointer}
.fld{font-size:13px;margin-top:8px}
.fld input{display:block;margin-top:4px;min-height:40px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ink)}
.fld .hint{display:block}
.whoact{display:flex;gap:6px;margin-top:10px}
.whoact button{min-height:40px;padding:0 16px;font-weight:650}
</style>
</head>
<body>
<div id="frame">
<div id="rail"></div>
<div class="page">
<header><div class="hrow"><h1 id="title">Kinnect <span class="app">Relay</span></h1><span id="who"></span></div><div class="hrow sub"><div id="me" class="me" hidden></div><span id="role"></span></div></header>
<nav id="kbar" class="kbar" aria-label="Kinnect tools"></nav>
<nav id="views" class="views" aria-label="Relay views"></nav>
<div id="banner"></div>
<main id="main"><section class="none">Loading...</section></main>
</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="gate"><div class="boot" role="status" aria-live="polite"><div class="bootin"><div class="spinner" aria-hidden="true"></div><h1>Kinnect Relay</h1><p>Loading…</p></div></div></div>
<script src="dev-updates.js?v=8"></script>
<script src="shell.js?v=8"></script>
<script src="taskpane.js?v=8"></script>
</body>
</html>
